<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MTG Top Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sitio oscuro de un solo tema (el arte de las cartas es el color); barra fija, columna de 1160px, mazos en tarjetas con arte */
:root{
  color-scheme:dark;
  --bg:#0c0e13; --surface:#151821; --surface2:#1c202b; --ink:#f2f3f7; --muted:#9499a8; --line:#272c39;
  --accent:#f0b94a; --accent-soft:#2b2412;
  --bar:#0c0e13; --bar-ink:#f2f3f7; --bar-muted:#9499a8;
  --tS1:#ff8a3d; --tS2:#d1401f; --tA1:#f5d36e; --tA2:#c08a17; --tB1:#c4d0de; --tB2:#6d819a; --tC1:#8a90a3; --tC2:#4a5063;
  --gold:#f0b94a;
  --mW:#e9e1bf; --mU:#2f6fb3; --mB:#8b8790; --mR:#c8452b; --mG:#2f7d4a; --mC:#b9b6ad;
  --display:Montserrat,"Segoe UI",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--ink);text-decoration:none} a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(12,14,19,.88);backdrop-filter:blur(10px);color:var(--bar-ink);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--bar-ink);line-height:1}
.brand:hover{text-decoration:none}
.brand svg{flex:none}
.brand small{color:var(--accent);font-weight:800;font-size:1em}
nav{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.navgroup{display:flex;align-items:center;gap:8px}
.gitems{display:flex;gap:2px}
.navgroup:not(.rest){background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 14px}
.glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.navgroup.rest{margin-left:auto}
.navgroup.rest .glabel,nav a.dup,.menubtn{display:none}
nav a{font-family:var(--body);font-weight:600;font-size:14px;color:var(--bar-muted);padding:7px 11px;border-radius:999px;line-height:1}
nav a.on{color:#14110a;background:var(--accent)}
nav a:hover{text-decoration:none;color:var(--bar-ink)}
nav a.on:hover{color:#14110a}
main{padding-block:28px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
main>*{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0 0 14px;line-height:1.1}
h2 a{color:inherit}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.kicker{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.secthead h2{margin:0}
.stats{display:flex;gap:12px 36px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* Portada: mosaico de arte detrás del título */
.hero{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 0 0 1px var(--line);background:var(--bar);color:var(--bar-ink);isolation:isolate}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:110px;z-index:-2;opacity:.55}
.mosaic img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bar) 15%,rgba(12,14,19,.8) 55%,rgba(12,14,19,.3))}
.hero-in{padding:44px 32px 36px;max-width:640px;display:grid;gap:12px}
.hero-in .sub,.hero-in .stats{margin-top:0}
.hero .kicker,.hero .sub,.hero .stat span{color:var(--bar-muted)}
.hero .sub{color:#c9cdda}
.hero .stat b{color:var(--bar-ink)}
.manarow{display:inline-flex;gap:4px;margin-right:8px;vertical-align:-2px}
/* Tarjetas de formato */
.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.fmt{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:130px;padding:14px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);color:var(--ink);isolation:isolate}
.fmt:hover{color:inherit;border-color:var(--accent)}
.fmt .bgart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.fmt.has{color:#fff;border-color:transparent}
.fmt.has:hover{color:#fff;box-shadow:0 0 0 2px var(--accent)}
.fmt.none b{color:var(--muted)}
.cmd:hover,td a:hover{color:var(--accent)}
.fmt.has::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,20,.1),rgba(10,12,20,.88) 70%)}
.fmt .code{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.fmt.has .code{background:rgba(0,0,0,.45);color:#fff}
.fmt b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.fmt span{font-size:13px;opacity:.85}
.fmt.none span{color:var(--muted);opacity:1}
/* Podio */
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.pcard{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.pcard .artbox{position:relative;aspect-ratio:16/10;max-width:100%;display:flex;overflow:hidden;background:var(--surface2)}
.pcard .artbox img{position:relative;flex:1 1 0;min-width:0;height:100%;object-fit:cover}
.pcard .artbox .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pcard .pos{position:absolute;top:8px;left:8px;min-width:34px;height:34px;padding:0 8px;display:grid;place-items:center;border-radius:999px;font-family:var(--display);font-weight:800;font-size:16px;background:rgba(10,12,20,.78);color:#fff;line-height:1}
.pcard.first .pos{background:linear-gradient(135deg,var(--tA1),var(--tA2));color:#1d1503}
.pcard .info{padding:10px 12px 12px;display:grid;gap:2px;min-width:0}
.pcard .who{font-weight:600}
.pcard .deck{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Tablas */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--body);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{white-space:nowrap;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.n b{font-weight:700}
td.w{white-space:normal;min-width:260px}
td.w .cmd{display:inline}
.place{font-family:var(--display);font-weight:800;font-size:19px;width:52px;line-height:1}
.place.p1{color:var(--gold)}
/* Tiers como rarezas */
.tier{display:inline-block;white-space:nowrap;padding:4px 9px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.02em;color:#fff;line-height:1.1}
.tier.S{background:linear-gradient(160deg,var(--tS1),var(--tS2))}
.tier.A{background:linear-gradient(160deg,var(--tA1),var(--tA2));color:#1d1503}
.tier.B{background:linear-gradient(160deg,var(--tB1),var(--tB2))}
.tier.C{background:linear-gradient(160deg,var(--tC1),var(--tC2))}
.tier.obs{white-space:nowrap;background:transparent;color:var(--muted);border:1px dashed var(--muted);border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;padding:3px 6px;text-transform:uppercase}
.legend{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:8px}
.legend .tier{font-size:11px}
.pips{display:inline-flex;gap:2px;margin-right:8px;vertical-align:-1px}
.pip{width:15px;height:15px;flex:none;border-radius:50%;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.cmd{display:inline-flex;align-items:center;font-weight:600}
.thumbs{display:inline-flex;gap:2px;width:56px;margin-right:12px;flex:none;vertical-align:middle}
.th{position:relative;width:56px;height:40px;border-radius:4px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.thumbs.two .th{width:27px}
.cmdrow .pips{width:84px;flex:none}
.th .ini{font-family:var(--display);font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmdrow{display:inline-flex;align-items:center;min-width:0}
.flag{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:8px;padding:2px 6px;border:1px solid var(--line);border-radius:999px}
/* Barras de presencia */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 140px 52px;gap:12px;align-items:center;font-size:14px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lab .cmd{display:inline}
.bar .track{height:12px;background:var(--surface2);border-radius:0 4px 4px 0;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#14110a;border-color:var(--accent)}
.chip .pips{margin-right:6px}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
input[type=search]{font:inherit;font-size:17px;width:100%;max-width:560px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px}
.grid2>*{min-width:0}
.kv{display:flex;gap:12px 36px;flex-wrap:wrap;align-items:flex-end}
.pagehead{display:grid;gap:6px}
.strip{display:flex;gap:4px;margin-top:16px;overflow:hidden;border-radius:6px;max-width:100%}
.strip .ph{width:72px;height:52px;flex:none;border-radius:3px;overflow:hidden}
.strip img{width:100%;height:100%;object-fit:cover}
.hero-cmd{position:relative;overflow:hidden;border-radius:10px;background:var(--bar);color:var(--bar-ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;padding:24px;isolation:isolate}
.hero-cmd .blur{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(24px) saturate(1.2);opacity:.55;z-index:-1;max-width:none}
.hero-cmd .arts{display:flex;gap:6px;flex-wrap:wrap}
.art{width:220px;aspect-ratio:4/3;max-width:100%;border-radius:6px;object-fit:cover;background:var(--surface2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero-cmd .kicker{color:#c9cdda}
/* Tarjetas de mazo estilo galería */
.toolbar{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ctl{display:grid;gap:4px}
.ctl label,.ctl .lbl{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;font-size:14px;padding:7px 30px 7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.manabtns{display:flex;gap:6px}
.mb{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:1px;opacity:1;background:transparent;transition:opacity .15s,transform .15s;display:grid;place-items:center}
.mb svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.mb:hover{transform:translateY(-1px)}
.manabtns.sel .mb{opacity:.35}
.manabtns.sel .mb.on{opacity:1;border-color:var(--accent)}
.mb:hover{opacity:.85}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:7px 12px;border:0;background:var(--surface2);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#14110a}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.ccard{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:190px;border-radius:14px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s;overflow:hidden;color:#fff;isolation:isolate;background:var(--bar)}
.ccard:hover{color:#fff;box-shadow:0 0 0 2px var(--accent),0 12px 28px rgba(0,0,0,.45);transform:translateY(-2px)}
.ccard .cart{position:absolute;inset:0;display:flex;z-index:-2}
.ccard .cart img{flex:1 1 0;min-width:0;height:100%;object-fit:cover;transition:transform .4s ease}
.ccard:hover .cart img{transform:scale(1.04)}
.ccard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,16,.78) 0%,rgba(8,10,16,.15) 42%,rgba(8,10,16,.15) 58%,rgba(8,10,16,.85) 100%)}
.ccard .ctop{display:flex;gap:10px;align-items:flex-start;padding:12px 14px}
.ccard .ctop b{display:block;font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.ccard .ctop .pips{margin-top:6px}
.ccard .ctop .tier{flex:none;font-size:11.5px;margin-top:2px}
.ccard .ctop .tier.obs{color:#d6d9e3;border-color:#d6d9e3;font-size:9.5px;padding:2px 5px}
.ccard .cbot{display:flex;gap:4px 14px;flex-wrap:wrap;padding:9px 14px;font-size:13px;background:rgba(8,10,16,.55);backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
.ccard .cbot span{color:#c3c7d4}
.ccard .cbot b{color:#fff;font-weight:600}
.ccard .flags{display:flex;gap:6px;margin-top:6px}
.ccard .flag{margin:0;color:#e9ebf2;border-color:rgba(255,255,255,.35)}
/* Banner de comandante */
.banner{position:relative;overflow:hidden;border-radius:14px;min-height:280px;display:grid;place-items:center;text-align:center;color:#fff;isolation:isolate;background:var(--bar);padding:40px 20px}
.banner .cart{position:absolute;inset:0;display:flex;z-index:-2}
.banner .cart img{flex:1 1 0;min-width:0;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(8,10,16,.55),rgba(8,10,16,.85))}
.banner h1{color:#fff;font-size:clamp(28px,5vw,54px)}
.banner .pips{margin:10px 0 0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chips span{font-size:13px;padding:5px 10px;border-radius:6px;background:rgba(8,10,16,.6);color:#e9ebf2;font-variant-numeric:tabular-nums}
.chips b{color:#fff}
/* Tarjetas de resultado y de torneo */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.rcard{display:grid;gap:6px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-width:0}
a.rcard:hover{color:var(--ink);border-color:var(--accent)}
.rcard .top{display:flex;align-items:center;gap:10px;min-width:0}
.rcard .top b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .meta{font-size:13px;color:var(--muted)}
.rcard .line{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;padding-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.rcard .line span{color:var(--muted)}
.medal{flex:none;display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:50%;font-family:var(--body);font-weight:700;font-size:14px;background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.medal.m1{background:linear-gradient(160deg,var(--tA1),var(--tA2));color:#1d1503;box-shadow:none}
.medal.m2{background:linear-gradient(160deg,#e4e8ef,#8d97a7);color:#14181f;box-shadow:none}
.medal.m3{background:linear-gradient(160deg,#e0a47a,#8a4f2a);color:#fff;box-shadow:none}
.tcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-width:0}
.tcard:hover{color:var(--ink);border-color:var(--accent)}
.tcard .code{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.tcard b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.tcard .win{display:flex;align-items:center;gap:8px;font-size:13.5px;padding-top:8px;border-top:1px solid var(--line);min-width:0}
.tcard .win .thumbs{margin-right:0}
/* Puesto en la esquina del arte: medalla para el top 3, número para el resto */
.rank{position:absolute;top:10px;right:10px;z-index:1;display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:rgba(8,10,16,.72);backdrop-filter:blur(4px);color:#fff;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.rank.medal-svg{background:none;backdrop-filter:none;box-shadow:none;padding:0;min-width:0;height:auto;top:6px;right:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.rank.medal-svg svg{display:block;width:46px;height:46px}
.scard .ctop,.rcardk .ctop{padding-right:58px}
.rcardk .ctop{flex-wrap:wrap}
.scard .who{display:block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.15}

<script>
const BR = {
  cedh:{code:"B5",name:"cEDH (B5)",cmd:true}, b2:{code:"B2",name:"Commander B2",cmd:true},
  duel:{code:"DC",name:"Duel Commander",cmd:true}, standard:{code:"STD",name:"Standard",cmd:false},
  modern:{code:"MOD",name:"Modern",cmd:false}, pauper:{code:"PAU",name:"Pauper",cmd:false}};
const BYCODE = Object.fromEntries(Object.entries(BR).map(([k,v])=>[v.code,{...v,key:k}]));
const fmtName = c => (BYCODE[c]||{name:c||"–"}).name;
const isCmdName = n => { const c = DB.cmdIndex[n]; return !c || !BYCODE[c.bracket] || BYCODE[c.bracket].cmd; };
const unitLabel = code => (BYCODE[code]&&!BYCODE[code].cmd) ? "Arquetipo" : "Comandante";
const PERIODS = [["todo","Todo"],["12m","12 meses"],["3m","3 meses"],["1m","1 mes"]];
let DB = null, period = "todo", colorFilter = "", sortBy = "tier", minN = 0, viewMode = "cards";
try{ viewMode = localStorage.getItem("vista") || "cards"; }catch(e){}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const pct = x => x==null||isNaN(x) ? "–" : (x*100).toFixed(1).replace(".",",")+"%";
const dec = x => x==null||isNaN(x) ? "–" : x.toFixed(2).replace(".",",");
const fdate = s => { if(!s) return "–"; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };

function sinceDate(p){
  if(p==="todo") return "0000";
  const d = new Date(); d.setMonth(d.getMonth() - ({"12m":12,"3m":3,"1m":1})[p]);
  return d.toISOString().slice(0,10);
}
function colorsOf(name){
  const c = DB.cmdIndex[name]; return c && c.colores ? c.colores.toUpperCase().replace(/[^WUBRG]/g,"") : "";
}
const manaIcon = (c, cls) => `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true"><use href="#ms-${c}"/></svg>`;
function pips(name){
  const cs = colorsOf(name);
  const list = cs ? cs.split("") : ["X"];
  return `<span class="pips" role="img" aria-label="Colores: ${cs||"incoloro"}">${list.map(c=>manaIcon(c==="X"?"C":c,"pip")).join("")}</span>`;
}
function cmdLink(name){
  if(name==="Desconocido") return `<span class="cmd" style="color:var(--muted)">Desconocido</span>`;
  return `<a class="cmd" href="#cmd-${slug(name)}">${pips(name)}${esc(name)}</a>`;
}
const MANA = {W:"#e9dfb4",U:"#2f6fb3",B:"#3a3740",R:"#c8452b",G:"#2f7d4a"};
function scry(p){ return "https://api.scryfall.com/cards/named?exact="+encodeURIComponent(p)+"&format=image&version=art_crop"; }
function imgFail(el){ if(el.dataset.f!=="1" && el.dataset.alt){ el.dataset.f="1"; el.src=el.dataset.alt; } else el.remove(); }
function thumb(name){
  if(!name || name==="Desconocido") return `<span class="thumbs"><span class="th" style="background:var(--line)"><span class="ini" style="color:var(--muted);text-shadow:none">?</span></span></span>`;
  const cmd = isCmdName(name), card = (DB.cmdIndex[name]||{}).carta;
  const parts = cmd ? name.split(" + ") : [name];
  const cs = (colorsOf(name)||"").split("").map(c=>MANA[c]).filter(Boolean);
  const bg = cs.length>1 ? `linear-gradient(135deg,${cs.join(",")})` : (cs[0]||"#8a918d");
  return `<span class="thumbs ${parts.length>1?"two":""}">${parts.map(p=>{
    const ini = p.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
    const imgName = cmd ? p : card;
    if(!imgName) return `<span class="th" style="background:${bg}"><span class="ini">${ini}</span></span>`;
    const local = (DB.imagenes||[]).includes(slug(imgName));
    const src = local ? `img/${slug(imgName)}.jpg` : scry(imgName);
    return `<span class="th" style="background:${bg}"><span class="ini">${ini}</span><img alt="" loading="lazy" src="${src}" ${local?`data-alt="${scry(p)}"`:""} onerror="imgFail(this)"></span>`;
  }).join("")}</span>`;
}
const HD = !document.querySelector('meta[name$="viewport-fit-sides"]'); /* en el sitio publicado se pide el arte grande a Scryfall */
const localSrc = n => (DB.imagenes||[]).includes(slug(n)) ? `img/${slug(n)}.jpg` : "";
function bigImg(n, cls){
  const loc = localSrc(n), first = HD ? scry(n) : (loc || scry(n)), alt = HD ? loc : (loc ? scry(n) : "");
  return `<img class="${cls||""}" alt="" loading="lazy" src="${first}" ${alt?`data-alt="${alt}"`:""} onerror="imgFail(this)">`;
}
function artParts(name){
  if(!name || name==="Desconocido") return [];
  if(isCmdName(name)) return name.split(" + ");
  const c = (DB.cmdIndex[name]||{}).carta; return c ? [c] : [];
}
function gradOf(name){
  const cs = (colorsOf(name)||"").split("").map(c=>MANA[c]).filter(Boolean);
  return cs.length>1 ? `linear-gradient(135deg,${cs.join(",")})` : (cs[0]||"#4a5063");
}

function podium(rs){
  const top = rs.filter(r=>Number(r.puesto)<=4).slice(0,4);
  if(!top.length) return "";
  return `<div class="podium">${top.map(r=>`<div class="pcard ${Number(r.puesto)===1?"first":""}">
    <div class="artbox" style="background:${gradOf(r.comandante)}"><span class="ini">${initials(r.comandante||"?")}</span>${artParts(r.comandante).map(p=>bigImg(p)).join("")}${rankBadge(r.puesto)}</div>
    <div class="info"><a class="who" href="#jugador-${slug(r.jugador)}">${esc(r.jugador)}</a><span class="deck">${cmdLink(r.comandante)}</span></div></div>`).join("")}</div>`;
}
function cmdThumbLink(name){
  if(name==="Desconocido") return `<span class="cmdrow">${thumb(name)}<span style="color:var(--muted)">Desconocido</span></span>`;
  return `<span class="cmdrow">${thumb(name)}<a class="cmd" href="#cmd-${slug(name)}">${pips(name)}${esc(name)}</a></span>`;
}
const TIERNAME = {S:"Tier S",A:"Tier 1",B:"Tier 2",C:"Tier 3",obs:"En observación"};
function tierBadge(t){ return t==="obs" ? `<span class="tier obs">En observación</span>` : `<span class="tier ${t}">${TIERNAME[t]}</span>`; }

/* Métricas: mismas fórmulas que la hoja Estadísticas */
function enrich(){
  const tmap = {}; DB.torneos.forEach(t => tmap[t.id] = t);
  DB.tmap = tmap; DB.cmdIndex = {}; DB.comandantes.forEach(c => DB.cmdIndex[c.nombre] = c);
  DB.resultados.forEach(r => {
    const t = tmap[r.torneo] || {}; r.t = t; r.bracket = t.bracket; r.fecha = t.fecha;
    const n = t.jugadores, p = Number(r.puesto);
    r.pr = (n>1 && p) ? 1 - (p-1)/(n-1) : null;
    r.top = (n && p) ? (p <= Math.ceil(n/4) ? 1 : 0) : null;
    r.win = p === 1 ? 1 : 0;
  });
}
function stats(code, p){
  const since = sinceDate(p);
  const rs = DB.resultados.filter(r => r.bracket===code && (r.fecha||"") >= since);
  const known = rs.filter(r => r.comandante && r.comandante!=="Desconocido");
  const by = {};
  known.forEach(r => { (by[r.comandante] ||= []).push(r); });
  const rows = Object.entries(by).map(([name, list]) => {
    const n = list.length, torneos = new Set(list.map(r=>r.torneo)).size;
    const prs = list.filter(r=>r.pr!=null).map(r=>r.pr);
    const sum = prs.reduce((a,b)=>a+b,0);
    const top = list.reduce((a,r)=>a+(r.top||0),0), wins = list.reduce((a,r)=>a+r.win,0);
    const pilots = {}; list.forEach(r => pilots[r.jugador]=(pilots[r.jugador]||0)+1);
    const maxPilot = Math.max(...Object.values(pilots));
    const s = { name, n, torneos, pr: prs.length? sum/prs.length : null, prAdj:(sum+1.5)/(prs.length+3),
      top, convAdj:(top+1)/(n+4), wins, pres: n/known.length, pilot: n>=2 && maxPilot/n>0.5 };
    s.tier = (n<4 || torneos<2) ? "obs" :
      (s.prAdj>=0.65 && s.pres>=0.08) ? "S" :
      (s.prAdj>=0.65 || (s.prAdj>=0.58 && (s.pres>=0.05 || s.convAdj>=0.4))) ? "A" :
      s.prAdj>=0.45 ? "B" : "C";
    return s;
  });
  const order = {S:0,A:1,B:2,C:3,obs:4};
  rows.sort((a,b)=> order[a.tier]-order[b.tier] || b.prAdj-a.prAdj || b.convAdj-a.convAdj || b.wins-a.wins);
  const torneos = DB.torneos.filter(t => t.bracket===code && (t.fecha||"") >= since).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  return { rows, torneos, entries: rs.length, unknown: rs.length-known.length };
}

function tierTable(rows, compact, code){
  if(!rows.length) return `<div class="empty">Aún no hay resultados en este periodo.</div>`;
  return `<div class="tbl"><table><thead><tr><th>Tier</th><th>${unitLabel(code)}</th><th class="n">Entradas</th>
    <th class="n">Presencia</th><th class="n">PR ajust.</th>${compact?"":`<th class="n hide-sm">PR prom.</th><th class="n hide-sm">Top 25%</th><th class="n hide-sm">Conv. ajust.</th>`}<th class="n">Ganados</th></tr></thead><tbody>
    ${rows.map(s=>`<tr><td>${tierBadge(s.tier)}</td><td class="w">${cmdThumbLink(s.name)}${s.pilot?`<span class="flag" title="Más de la mitad de sus entradas son de un solo jugador">1 piloto</span>`:""}${s.pres>=0.15&&s.n>=4?`<span class="flag">Dominante</span>`:""}</td>
      <td class="n">${s.n}</td><td class="n">${pct(s.pres)}</td><td class="n"><b>${dec(s.prAdj)}</b></td>
      ${compact?"":`<td class="n hide-sm">${dec(s.pr)}</td><td class="n hide-sm">${s.top}</td><td class="n hide-sm">${pct(s.convAdj)}</td>`}<td class="n">${s.wins}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function eventsTable(ts){

  return `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Torneo</th><th class="hide-sm">Formato</th><th class="n">Jugadores</th><th>Ganador</th></tr></thead><tbody>
    ${ts.map(t=>{ const w = DB.resultados.find(r=>r.torneo===t.id && Number(r.puesto)===1);

    </tbody></table></div>`;

function presenceBars(rows, unknown, total){
  if(!rows.length) return "";
  const top = [...rows].sort((a,b)=>b.n-a.n).slice(0,12);
  const max = Math.max(...top.map(r=>r.pres));
  return `<div class="bars">${top.map(r=>`<div class="bar"><div class="lab">${cmdLink(r.name)}</div>
    <div class="track"><div class="fill" style="width:${(r.pres/max*100).toFixed(1)}%"></div></div><div class="pct">${pct(r.pres)}</div></div>`).join("")}</div>
    ${unknown?`<p class="note">${unknown} de ${total} entradas sin mazo conocido no cuentan en la presencia.</p>`:""}`;
}
function periodChips(){
  return `<div class="filters"><span class="kicker">Periodo</span>${PERIODS.map(([k,l])=>`<button class="chip ${period===k?"on":""}" data-period="${k}">${l}</button>`).join("")}</div>`;
}
function colorChips(){

function cardArt(name){ return `<span class="cart" style="background:${gradOf(name)}">${artParts(name).map(p=>bigImg(p)).join("")}</span>`; }
function deckCards(rows){
  if(!rows.length) return `<div class="empty">Aún no hay resultados con estos filtros.</div>`;
  return `<div class="cgrid">${rows.map((s,i)=>`<a class="ccard rcardk" href="#cmd-${slug(s.name)}">${cardArt(s.name)}<span class="rank" aria-label="Puesto ${i+1}">${i+1}</span>
    <span class="ctop">${tierBadge(s.tier)}<span><b>${esc(s.name)}</b>${pips(s.name)}${(s.pilot||(s.pres>=0.15&&s.n>=4))?`<span class="flags">${s.pilot?`<span class="flag">1 piloto</span>`:""}${s.pres>=0.15&&s.n>=4?`<span class="flag">Dominante</span>`:""}</span>`:""}</span></span>

}

function notFound(){ return `<div class="empty">No encontramos esa página. <a href="#inicio">Volver al inicio</a></div>`; }
function search(q){
  q = slug(q); const out = document.getElementById("res"); if(!q){ out.innerHTML=""; return; }
  const cmds = [...new Set(DB.resultados.map(r=>r.comandante))].filter(n=>n!=="Desconocido" && slug(n).includes(q));
  const plys = [...new Set(DB.resultados.map(r=>r.jugador))].filter(n=>slug(n).includes(q));
  const tns = DB.torneos.filter(t=>slug(t.tienda+" "+(t.tipo||"")+" "+t.id).includes(q));
  const sec = (title, items) => items.length ? `<section><h2>${title}</h2><div class="tbl"><table><tbody>${items.join("")}</tbody></table></div></section>` : "";
  out.innerHTML = (sec("Mazos", cmds.map(n=>`<tr><td>${cmdLink(n)}</td></tr>`)) +
    sec("Jugadores", plys.map(n=>`<tr><td><a href="#jugador-${slug(n)}">${esc(n)}</a></td></tr>`)) +
    sec("Torneos", tns.map(t=>`<tr><td>${fdate(t.fecha)}</td><td><a href="#torneo-${slug(t.id)}">${esc(t.tipo||"Torneo")} @ ${esc(t.tienda)}</a></td></tr>`))) || `<div class="empty">Sin resultados.</div>`;
}

function setMenu(open){ const h = document.querySelector("header"); h.classList.toggle("open", open); document.getElementById("menubtn").setAttribute("aria-expanded", open); }
document.getElementById("menubtn").onclick = e => { e.stopPropagation(); setMenu(!document.querySelector("header").classList.contains("open")); };
document.addEventListener("click", e => { if(!e.target.closest("header")) setMenu(false); });
document.addEventListener("keydown", e => { if(e.key==="Escape") setMenu(false); });
document.getElementById("nav").addEventListener("click", e => { if(e.target.closest("a")) setMenu(false); });
function route(){
  const h = (location.hash||"#inicio").slice(1) || "inicio";
  let html, nav = h;
  if(BR[h]) html = views.bracket(h);
  else if(h.startsWith("torneo-")) { html = views.torneo(h.slice(7)); nav=""; }
  else if(h.startsWith("cmd-")) { html = views.cmd(h.slice(4)); nav=""; }
  else if(h.startsWith("jugador-")) { html = views.jugador(h.slice(8)); nav=""; }
  else if(h==="buscar") html = views.buscar();
  else if(h==="torneos") html = views.torneos();
  else { html = views.inicio(); nav="inicio"; }
  const app = document.getElementById("app"); app.innerHTML = html;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r===nav));
  const onA = document.querySelector("#nav a.on:not(.solo)") || document.querySelector("#nav a.on");
  document.getElementById("menulbl").textContent = onA ? onA.textContent : "Menú";
  setMenu(false);
  app.querySelectorAll("[data-period]").forEach(b => b.onclick = () => { period=b.dataset.period; route(); });
  app.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { colorFilter=b.dataset.color; route(); });
  app.querySelectorAll("[data-mana]").forEach(b => b.onclick = () => { const c=b.dataset.mana; colorFilter = colorFilter.includes(c) ? colorFilter.replace(c,"") : colorFilter+c; route(); });
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { viewMode=b.dataset.view; try{localStorage.setItem("vista",viewMode)}catch(e){} route(); });
  const fs = document.getElementById("f-sort"); if(fs) fs.onchange = () => { sortBy=fs.value; route(); };
  const fp = document.getElementById("f-period"); if(fp) fp.onchange = () => { period=fp.value; route(); };
  const fm = document.getElementById("f-min"); if(fm) fm.onchange = () => { minN=Number(fm.value); route(); };
  const q = document.getElementById("q"); if(q){ q.oninput = () => search(q.value); q.focus(); }
}
fetch("data.json").then(r=>r.json()).then(d=>{
  DB = d; enrich();
  document.getElementById("foot").textContent = `Metagame local de Magic en Perú, armado con los standings finales de cada torneo. Datos actualizados al ${fdate(d.generado)}.`;
  route(); addEventListener("hashchange", () => { route(); scrollTo(0,0); });
}).catch(()=>{ document.getElementById("app").innerHTML = `<div class="empty">No se pudo cargar data.json. Abre la página desde un servidor (GitHub Pages o similar), no como archivo local.</div>`; });
</script>
</body>
</html>
